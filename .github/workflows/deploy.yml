name: Deploy

on:
  push:
    branches:
    - master
    - actions
  pull_request:

concurrency:
  group: ariadne-website-deploy
  cancel-in-progress: true

env:
  HUGO_VERSION: 0.147.9
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Hugo
      run: |
        mkdir -p "$HOME/bin"
        curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" -o /tmp/hugo.tar.gz
        echo "cb077c25518c9263cd506baa2cec7016c41100b1ab4df1c93c110ff1718c98fc  /tmp/hugo.tar.gz" | shasum -a 256 -c -
        tar -xzf /tmp/hugo.tar.gz -C "$HOME/bin" hugo
        echo "$HOME/bin" >> "$GITHUB_PATH"
        "$HOME/bin/hugo" version

    - name: Build
      run: |
        git submodule update --init --recursive
        hugo

    - name: Upload
      if: github.event_name == 'push'
      timeout-minutes: 10
      run: python3 scripts/deploy.py
