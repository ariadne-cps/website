name: Deploy

on:
  push:
    branches:
    - master
    - actions
  pull_request:

env:
  HUGO_VERSION: 0.147.9
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

jobs:
  build:
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        mkdir -p "$HOME/bin"
        curl -L "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_darwin-universal.tar.gz" -o /tmp/hugo.tar.gz
        echo "e40d8a6f8a89ceaa5dd8b9c01ce413829eefc2de43c6e35539589200b19e6823  /tmp/hugo.tar.gz" | shasum -a 256 -c -
        tar -xzf /tmp/hugo.tar.gz -C "$HOME/bin" hugo
        echo "$HOME/bin" >> "$GITHUB_PATH"
        "$HOME/bin/hugo" version
        npm install -g gulp vinyl-ftp gulp-util minimist --save-dev
        npm install gulp vinyl-ftp gulp-util minimist
    
    - name: Build
      run: |
        git submodule update --init --recursive
        hugo

    - name: Upload
      run: gulp deploy --user $FTP_USER --password $FTP_PASSWORD
        
